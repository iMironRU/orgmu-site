name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Вызывается скрапером новостей: его коммит сам деплой не запускает —
  # GitHub не триггерит workflow на пуш, сделанный штатным GITHUB_TOKEN
  # (защита от рекурсии). Поэтому сборку зовём явно.
  workflow_call:

# Права для деплоя на Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Одновременно только один прогон, но НОВЫЙ НЕ ОТМЕНЯЕТ текущий. Раньше стояло
# cancel-in-progress: true, и это ломало FTP-выкладку: частый пуш отменял её на
# полпути, манифест (пишется в конце) не дописывался, и следующий деплой лил
# сайт целиком с нуля — по кругу. Пуши теперь идут очередью; при новостях раз в
# два часа она короткая.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Именно вершину ветки, а не github.sha: когда деплой вызван
          # скрапером, свежий коммит с новостями сделан уже внутри прогона и
          # в github.sha его нет — собралось бы состояние до новостей.
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build (static export)
        env:
          # Сайт живёт в КОРНЕ своего домена (new.orgma.ru), поэтому basePath
          # пустой. Домен задан в настройках Pages репозитория — при сборке
          # через Actions файл public/CNAME на это не влияет, не заводите его.
          # Если домен когда-нибудь снимут, сайт вернётся на
          # imiron.ru/orgmu-site и сюда надо будет вернуть
          # ${{ steps.pages.outputs.base_path }}.
          NEXT_PUBLIC_BASE_PATH: ""
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Вторая площадка: сервер вуза. ОТДЕЛЬНЫЙ job, а не шаг в build, — иначе
  # долгая FTP-выкладка (при смене кода build-id меняется, и уходит весь сайт)
  # задерживала бы деплой на Pages: раньше страница висела 404, пока лилось на
  # FTP. Теперь Pages и FTP идут параллельно и независимо; падение FTP на Pages
  # не влияет. Собственная сборка (а не артефакт Pages) — так job полностью
  # самостоятелен и проще.
  ftp:
    if: ${{ vars.FTP_ENABLED != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (static export)
        env:
          NEXT_PUBLIC_BASE_PATH: ""
        run: npm run build

      - name: Установить lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # Сверка по контрольным суммам (см. сам скрипт): в сборке есть файлы,
      # меняющиеся без изменения размера, и lftp mirror их пропускал.
      - name: Выложить на сервер вуза (FTP)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: node scripts/deploy/ftp-sync.mjs
